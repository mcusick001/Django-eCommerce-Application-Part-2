{% extends 'base.html' %}
{% block title %}Enter New Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-3">Set New Password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-2">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
