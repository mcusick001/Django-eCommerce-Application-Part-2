{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm text-center">
        <h2 class="fw-bold text-success mb-3">Password Reset Complete</h2>
        <p class="text-muted">Your password has been set successfully. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2 px-4">Log In</a>
    </div>
</div>
{% endblock %}
