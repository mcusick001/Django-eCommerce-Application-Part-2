{% extends 'base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm text-center">
        <h2 class="fw-bold text-success mb-3">Check Your Email</h2>
        <p class="text-muted">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-2">Return to Login</a>
    </div>
</div>
{% endblock %}
