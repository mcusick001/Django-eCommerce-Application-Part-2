{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-2">Reset Password</h2>
        <p class="text-muted">Enter your email address below, and we'll email you instructions for setting a new password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
