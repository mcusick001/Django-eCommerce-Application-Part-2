{% extends 'base.html' %}
{% block title %}Store Form{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-3">{% if store %}Edit Store{% else %}Create Store{% endif %}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Save Store</button>
        </form>
    </div>
</div>
{% endblock %}
