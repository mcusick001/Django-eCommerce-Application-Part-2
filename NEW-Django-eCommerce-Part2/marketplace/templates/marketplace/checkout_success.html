{% extends 'base.html' %}
{% block title %}Checkout Successful{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center bg-white p-5 rounded shadow-sm">
        <div class="display-1 text-success mb-3">✓</div>
        <h2 class="fw-bold mb-3">Order Placed Successfully!</h2>
        <p class="text-muted lead">Thank you for your purchase. Order <strong>#{{ order.id }}</strong> has been confirmed and your invoice has been emailed to you.</p>
        <hr class="my-4">
        <h4 class="fw-bold">Total Paid: ${{ total }}</h4>
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg mt-3">Continue Shopping</a>
    </div>
</div>
{% endblock %}
