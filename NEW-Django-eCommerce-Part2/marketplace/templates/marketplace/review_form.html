{% extends 'base.html' %}
{% block title %}Write Review{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-2">Leave a Review</h2>
        <h4 class="text-muted mb-4">Product: {{ product.name }}</h4>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Submit Review</button>
        </form>
    </div>
</div>
{% endblock %}
