{% extends 'base.html' %}
{% block title %}Product Form{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm">
        <h2 class="fw-bold mb-3">{% if product %}Edit Product{% else %}Add Product{% endif %}</h2>
        {% if store %}<h5 class="text-muted mb-3">Store: {{ store.name }}</h5>{% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Save Product</button>
        </form>
    </div>
</div>
{% endblock %}
