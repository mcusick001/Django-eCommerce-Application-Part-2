{% extends 'base.html' %}
{% block title %}Remove Product{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow-sm text-center">
        <h3 class="fw-bold text-danger mb-3">Remove Product</h3>
        <p>Are you sure you want to delete product <strong>"{{ product.name }}"</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4 me-2">Confirm Remove</button>
            <a href="{% url 'vendor_dashboard' %}" class="btn btn-secondary px-4">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
